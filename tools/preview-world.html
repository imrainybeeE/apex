<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>World preview</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ?nofilter=1 emulates Safari (no ctx.filter) to exercise the blur fallback.
if (/nofilter=1/.test(location.search)) { delete CanvasRenderingContext2D.prototype.filter; console.log('ctx.filter removed: ' + !('filter' in document.createElement('canvas').getContext('2d'))); }
// Optional shape modules (used for silhouettes if present); load failures are ignored.
(function () {
  ['../js/shapes-inverts.js', '../js/shapes-land.js', '../js/shapes-air-water.js'].forEach(function (src) {
    var s = document.createElement('script');
    s.async = false; s.src = src; s.onerror = function () {};
    document.head.appendChild(s);
  });
})();
</script>
<script src="../js/world.js"></script>
<script>
// ?b=litter|undergrowth|pond  &h=harmony(0-100)  &zoom=px/unit  &barren=1  &x=&y=  &pan=0  &dpr=1  &mobs=1
window.addEventListener('load', function () {
  var A = window.Apex, q = new URLSearchParams(location.search);
  var biome = q.get('b') || 'litter', harmony = q.has('h') ? +q.get('h') : 70;
  var dpr = +(q.get('dpr') || 1), canvas = document.getElementById('c');
  var W = innerWidth, H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var ctx = canvas.getContext('2d', { willReadFrequently: false });
  A.W = W; A.H = H; A.DPR = dpr;
  var hab = { litter: 'land', undergrowth: 'land', pond: 'land' }[biome] || 'land';
  var tier = { id: 't_' + biome, biome: biome, habitat: hab, world: 2600, next: [] };
  A.G = { eco: { harmony: harmony, flags: { barren: q.get('barren') === '1' } } };
  var zoom = +(q.get('zoom') || (H / 216));
  var t0 = performance.now();
  A.World.init();
  A.World.autoQuality = false;
  A.World.build(tier);
  console.log('build ms: ' + Math.round(performance.now() - t0));
  var cam = { x: +(q.get('x') || 1300), y: +(q.get('y') || 1300), zoom: zoom, shakeX: 0, shakeY: 0 };
  var toff = +(q.get('t') || 0), pan = q.get('pan') !== '0', frames = 0, acc = 0, parts = [0, 0, 0, 0];
  var mobs = q.get('mobs') !== '0';
  // Stand-in creatures so ground contrast can be judged: ant, prey, hunter.
  function blob(x, y, r, c1, c2) {
    var sx = (x - cam.x) * cam.zoom + W / 2, sy = (y - cam.y) * cam.zoom + H / 2, pr = r * cam.zoom;
    var g = ctx.createRadialGradient(sx - pr * .3, sy - pr * .3, pr * .1, sx, sy, pr);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(sx, sy, pr * 1.3, pr, 0.3, 0, Math.PI * 2); ctx.fill();
  }
  function frame(now) {
    var t = now / 1000 + toff;
    if (pan) { cam.x = +(q.get('x') || 1300) + Math.sin(t * 0.15) * 160; cam.y = +(q.get('y') || 1300) + Math.cos(t * 0.11) * 120; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var a = performance.now();
    A.World.drawDepthBelow(ctx, cam, t);
    ctx.getImageData(0, 0, 1, 1);
    var a1 = performance.now();
    A.World.drawBack(ctx, cam, t);
    ctx.getImageData(0, 0, 1, 1);
    var b = performance.now();
    if (mobs) {
      blob(cam.x, cam.y, 12, '#5a3a22', '#1d120a');
      blob(cam.x + 60, cam.y - 20, 4, '#9ed85a', '#4d8a2a');
      blob(cam.x + 44, cam.y + 36, 4, '#9ed85a', '#4d8a2a');
      blob(cam.x - 70, cam.y + 30, 9, '#d8c27a', '#8a6a2a');
      blob(cam.x - 40, cam.y - 60, 22, '#c8503a', '#6a2012');
    }
    var c = performance.now();
    A.World.drawFront(ctx, cam, t);
    ctx.getImageData(0, 0, 1, 1);
    var c2 = performance.now();
    A.World.drawDepthAbove(ctx, cam, t);
    ctx.getImageData(0, 0, 1, 1); // force raster so timing includes GPU/software paint
    var d = performance.now();
    if (frames >= 10) { acc += (d - a) - (c - b); parts[0] += a1 - a; parts[1] += b - a1; parts[2] += c2 - c; parts[3] += d - c2; }
    frames++;
    if (frames === 130) { console.log('avg world ms/frame (120 frames): ' + (acc / 120).toFixed(2) + ' [below/back/front/above: ' + parts.map(function (v) { return (v / 120).toFixed(2); }).join(' / ') + ']'); window.__done = true; }
    requestAnimationFrame(frame);
  }
  if (q.get('loop') !== '0') requestAnimationFrame(frame);
});
</script>
</body>
</html>
