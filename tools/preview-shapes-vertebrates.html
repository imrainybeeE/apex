<!doctype html>
<html><head><meta charset="utf-8"><title>Vertebrate shapes preview</title>
<style>html,body{margin:0;background:#1c2616;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../js/shapes-land.js"></script>
<script src="../js/shapes-air-water.js"></script>
<script>
(function () {
  const A = window.Apex;

  // Extra looks used only here, to prove the plans are parameter-driven (not registered in the game).
  const X = {
    mouse: { plan: 'quadruped', habitat: 'land', len: 1.2, wid: 0.55, head: 0.7, snout: 0.9, snoutW: 0.3, eye: 0.34, ear: 'round', earSize: 1.5, tail: 'longthin', leg: 0.7, whiskers: true,
      pal: { body: '#b79a78', belly: '#efe3d0', accent: '#e8a0a6', dark: '#4a382a', eye: '#2a1810' } },
    fox: { plan: 'quadruped', habitat: 'land', len: 1.55, wid: 0.58, head: 0.78, snout: 1.05, snoutW: 0.3, eye: 0.3, ear: 'pointy', earSize: 1.25, tail: 'bushy', tailLen: 0.9, tailTip: 'light', leg: 1.1, darkLegs: true, muzzle: true, whiskers: true, gait: 'trot',
      pal: { body: '#d9702a', belly: '#f6e8d2', accent: '#f6e8d2', dark: '#2a1810', eye: '#3a2208' } },
    deer: { plan: 'quadruped', habitat: 'land', len: 1.7, wid: 0.62, head: 0.62, snout: 1.1, snoutW: 0.45, eye: 0.34, ear: 'long', earSize: 1.0, tail: 'short', leg: 1.4, gait: 'walk', horns: 'antlers', hornSize: 1.25, mark: 'spots',
      pal: { body: '#a0703c', belly: '#ecd9b4', accent: '#ecd9b4', dark: '#3a2616', eye: '#2a1a0c' } },
    bear: { plan: 'quadruped', habitat: 'land', len: 1.4, wid: 0.98, head: 0.55, snout: 0.7, snoutW: 0.6, eye: 0.3, ear: 'round', earSize: 0.8, tail: 'stub', leg: 1.2, gait: 'walk', waist: 1, muzzle: true,
      pal: { body: '#6b4a32', belly: '#a98a68', accent: '#a98a68', dark: '#20140e', eye: '#1a0e08' } },
    hawk: { plan: 'bird', habitat: 'air', len: 1.3, wid: 0.58, headR: 0.34, beak: 'hooked', beakLen: 0.4, neck: 0.1, span: 2.1, wing: 'broad', feathers: 10, flapRate: 9, tail: 'fan', tailLen: 0.9, marks: 'bars', eye: 0.8,
      pal: { body: '#8a5a38', belly: '#f0e4cc', accent: '#f0c43a', dark: '#2a1810', eye: '#f2b82a' } },
    owl: { plan: 'bird', habitat: 'air', len: 1.15, wid: 0.7, headR: 0.5, beak: 'hooked', beakLen: 0.2, neck: 0, span: 1.9, wing: 'round', feathers: 10, flapRate: 7, tail: 'short', tailLen: 0.3, marks: 'streaks', disk: true, eye: 1.2, headCol: 'belly',
      pal: { body: '#9a8266', belly: '#e9dcc0', accent: '#d8b038', dark: '#2a1e12', eye: '#f3c734' } },
    trout: { plan: 'fish', habitat: 'water', noShadow: true, body: 'fusiform', len: 1.6, wid: 0.5, tail: 'forked', stripes: 'spots', eye: 0.9,
      pal: { body: '#7e9b62', belly: '#e4dca8', accent: '#d68a52', dark: '#2a3a24', eye: '#e8c050' } },
    pike: { plan: 'fish', habitat: 'water', noShadow: true, body: 'elongate', len: 1.9, wid: 0.45, tail: 'fan', stripes: 'bars', teeth: true, eye: 0.8,
      pal: { body: '#5f8a4a', belly: '#d9d89c', accent: '#8aa04a', dark: '#1d3018', eye: '#f0d040' } },
    lynx: { plan: 'quadruped', habitat: 'land', len: 1.45, wid: 0.62, head: 0.85, snout: 0.45, snoutW: 0.6, eye: 0.34, ear: 'tufted', earSize: 1.3, tail: 'stub', leg: 1.2, mark: 'ruff', whiskers: true, muzzle: true, pupil: 'vslit',
      pal: { body: '#b69a6e', belly: '#efe3c8', accent: '#efe3c8', dark: '#2a2016', eye: '#d8c040' } },
    badger: { plan: 'quadruped', habitat: 'land', len: 1.4, wid: 0.75, head: 0.7, snout: 0.9, snoutW: 0.4, eye: 0.3, ear: 'round', earSize: 0.7, tail: 'short', leg: 0.7, mark: 'mask', muzzle: true,
      pal: { body: '#7c7c82', belly: '#f2f0ea', accent: '#f2f0ea', dark: '#17171a', eye: '#150f0a' } },
    bream: { plan: 'fish', habitat: 'water', noShadow: true, body: 'deep', len: 1.2, wid: 0.78, tail: 'lunate', stripes: 'bars', eye: 1,
      pal: { body: '#b89a52', belly: '#f0e2a8', accent: '#c4633a', dark: '#3a2a12', eye: '#e8d060' } },
  };
  Object.keys(X).forEach((k) => { if (!A.LOOKS[k]) A.LOOKS[k] = X[k]; });
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') || 'main';
  const FREEZE = q.get('t') !== null ? +q.get('t') : null;
  const W = innerWidth, H = innerHeight;
  cv.width = W; cv.height = H;

  // ---- background: mossy earth
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  (function () {
    const g = bg.getContext('2d');
    const gr = g.createRadialGradient(W * 0.5, H * 0.4, 50, W * 0.5, H * 0.5, W * 0.7);
    gr.addColorStop(0, '#3b4a28'); gr.addColorStop(1, '#202b17');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    let s = 7; const rn = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 2600; i++) {
      const x = rn() * W, y = rn() * H, r = 1 + rn() * 6;
      g.fillStyle = rn() < 0.5 ? 'rgba(120,150,70,' + (0.04 + rn() * 0.08) + ')' : 'rgba(40,28,16,' + (0.05 + rn() * 0.1) + ')';
      g.beginPath(); g.ellipse(x, y, r * 1.6, r, rn() * 3, 0, 6.3); g.fill();
    }
  })();

  // ---- tiny drawCreature, like core's
  let nextId = 100;
  function mk(sp, x, y, r, o) {
    return Object.assign({ id: nextId++, sp, x, y, r, vx: 0, vy: 0, angle: 0, phase: 0, state: 'wander', stateT: 0.5,
      biteT: 0, hurtT: 0, alt: 0, desperate: false, target: null, pal: null, rs: {}, alive: true, sick: false }, o || {});
  }
  function drawCreature(e, t) {
    const look = A.LOOKS[e.sp];
    if (!look) return;
    const plan = A.Shapes[look.plan];
    try {
      ctx.save();
      if (!look.noShadow) {
        const a = e.alt || 0;
        ctx.translate(e.x + a * e.r * 0.6, e.y + a * e.r * 0.9 + e.r * 0.06);
        ctx.rotate(e.angle);
        const rx = look.len * e.r, ry = look.wid * e.r;
        ctx.fillStyle = 'rgba(5,10,4,.16)'; ctx.beginPath(); ctx.ellipse(0, 0, rx * 1.05, ry * 1.1, 0, 0, 6.3); ctx.fill();
        ctx.fillStyle = 'rgba(5,10,4,.18)'; ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.8, ry * 0.85, 0, 0, 6.3); ctx.fill();
        ctx.restore(); ctx.save();
      }
      if (plan.worldSpace) plan(ctx, e, t, look);
      else { ctx.translate(e.x, e.y); ctx.rotate(e.angle); plan(ctx, e, t, look); }
      ctx.restore();
    } catch (err) {
      ctx.restore();
      if (!drawCreature.warned) drawCreature.warned = {};
      if (!drawCreature.warned[e.sp + err.message]) { drawCreature.warned[e.sp + err.message] = 1; console.error('draw ' + e.sp + ': ' + err.stack); }
    }
  }
  function label(s, x, y, size, col) {
    ctx.fillStyle = col || 'rgba(235,245,225,.85)'; ctx.font = (size || 12) + 'px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.fillText(s, x, y);
  }

  const ORDER = (q.get('only') ? q.get('only').split(',') : ['shrew', 'weasel', 'frog', 'skink', 'snake', 'heron', 'tadpole']
    .concat(['mouse', 'fox', 'deer', 'bear', 'lynx', 'badger', 'hawk', 'owl', 'trout', 'pike', 'bream']))
    .filter((k) => A.LOOKS[k]);
  const CORE = ['shrew', 'weasel', 'frog', 'skink', 'snake', 'heron', 'tadpole'].filter((k) => A.LOOKS[k]);
  const EXTRA = ORDER.filter((k) => CORE.indexOf(k) < 0);

  // ---- entity sets
  const SLNAMES = ['weasel', 'frog', 'skink', 'snake', 'heron', 'shrew'].filter((k) => A.LOOKS[k]);
  const big = [], small = [], states = [], fly = [];
  const bigR = +(q.get('r') || 45);
  function layoutBig(list, cx0, cy, cellW, perRow, rowH, r, out) {
    list.forEach((sp, i) => {
      const cx = cx0 + (i % perRow) * cellW + cellW / 2, cy2 = cy + Math.floor(i / perRow) * rowH;
      const sp2 = sp;
      const e = mk(sp2, cx, cy2, r, { angle: 0, vx: r * 1.1 });
      e.home = { x: cx, y: cy2 }; e.loop = sp === 'snake' || sp === 'tadpole';
      e.target = { x: cx + 120, y: cy2 - 90 };
      if (q.get('st')) e.stName = q.get('st');
      if (q.get('pal')) { const pp = q.get('pal').split(','); e.pal = { body: '#' + pp[0], accent: '#' + pp[1], pattern: null, patternType: 'none' }; }
      if (q.get('alt')) { e.alt = +q.get('alt'); e.vx = r * 5; }
      out.push(e);
    });
  }

  if (mode === 'states') {
    const ST = ['idle', 'windup', 'lunge', 'bite', 'hurt', 'desperate', 'hop'];
    ORDER.forEach((sp, ri) => ST.forEach((st, ci) => {
      const e = mk(sp, 130 + ci * 200, 110 + ri * +(q.get('rowH') || 170), bigR, { vx: 0 });
      e.home = { x: e.x, y: e.y }; e.stName = st; e.target = { x: e.x + 90, y: e.y - 50 };
      if (st === 'lunge') e.vx = 80;
      if (st === 'hop' && sp !== 'frog') e.stName = 'rest';
      if (q.get('alt')) { e.alt = +q.get('alt'); }
      states.push(e);
    }));
  } else if (mode === 'big') {
    const per = +(q.get('per') || 4);
    layoutBig(ORDER, 0, +(q.get("y0")||130), W / per, per, +(q.get('rowH') || 250), bigR, big);
  } else {
    layoutBig(CORE, 0, 118, W / CORE.length, CORE.length, 0, bigR, big);
    // gameplay-size flow
    let x = 20, y = 285;
    const sizes = [12, 17, 22, 28];
    CORE.forEach((sp) => {
      const look = A.LOOKS[sp];
      sizes.forEach((r) => {
        const w = look.len * r * 2.3 + 10;
        if (x + w > 760) { x = 20; y += 62; }
        const e = mk(sp, x + w / 2, y, r, { vx: r * 1.1 });
        e.home = { x: x + w / 2, y }; e.loop = false;
        small.push(e); x += w;
      });
    });
    // state matrix on the right: looks x states
    const SL = SLNAMES;
    const ST = ['idle', 'windup', 'lunge', 'bite', 'hurt', 'desperate', 'hop'];
    SL.forEach((sp, ri) => ST.forEach((st, ci) => {
      const e = mk(sp, 800 + ci * 90 + 50, 305 + ri * 96, 20, { vx: 0 });
      e.home = { x: e.x, y: e.y }; e.stName = st; e.target = { x: e.x + 70, y: e.y - 40 };
      if (st === 'lunge') e.vx = 80;
      if (st === 'hop' && sp !== 'frog') e.stName = 'rest';
      states.push(e);
    }));
    // heron flight + moving snake
    fly.push(mk('heron', 100, 565, 38, { alt: 1, state: 'fly', baseY: 565 }));
    fly.push(mk('hawk', 100, 670, 26, { alt: 1, state: 'fly', baseY: 670 }));
    fly.push(mk('owl', 100, 730, 22, { alt: 0.6, state: 'fly', baseY: 730 }));
    fly.push(mk('snake', 300, 800, 30, { vx: 60, baseY: 810 }));
    fly.push(mk('snake', 300, 870, 22, { vx: 60, baseY: 870 }));
  }
  const ALL = big.concat(small, states, fly);

  function stepAnim(e, dt, t) {
    // bobbing "walking in place" so gaits animate
    const sp = Math.hypot(e.vx, e.vy);
    e.phase += sp * dt / e.r;
    if (e.loop) {
      const R = e.r * (e.sp === 'snake' ? 0.55 : 1.1), w = e.sp === 'snake' ? 1.1 : 1.6;
      const a = t * w;
      e.x = e.home.x + Math.cos(a) * R; e.y = e.home.y + Math.sin(a) * R * 0.7;
      e.angle = Math.atan2(Math.cos(a) * R * 0.7, -Math.sin(a) * R);
      e.vx = Math.cos(e.angle) * e.r * 1.6; e.vy = Math.sin(e.angle) * e.r * 1.6;
    }
  }
  function applyState(e, t) {
    const st = e.stName;
    if (!st) return;
    e.state = 'wander'; e.biteT = 0; e.hurtT = 0; e.desperate = false;
    if (st === 'windup') { e.state = 'windup'; e.stateT = 0.32; }
    else if (st === 'lunge') { e.state = 'lunge'; e.stateT = 0.2; e.vx = e.r * 6; }
    else if (st === 'bite') e.biteT = 0.25 * (1 - ((t * 1.3) % 1));
    else if (st === 'hurt') e.hurtT = 0.25 * (1 - ((t * 1.1) % 1));
    else if (st === 'desperate') e.desperate = true;
    else if (st === 'hop') { e.state = 'hop'; e.vx = e.r * 4; }
    else if (st === 'rest') e.state = 'rest';
    if (st !== 'lunge' && st !== 'hop') e.vx = st === 'idle' ? e.r * 0.3 : 0;
    if (e.sp === 'heron' && st === 'hop') e.state = 'ambush';
  }
  function updateFly(t) {
    fly.forEach((e, i) => {
      if (e.sp === 'snake') {
        const R = 130 + i * 10, a = t * (0.5 + i * 0.1) + i;
        e.x = 400 + Math.cos(a) * R * (1 + 0.5 * Math.sin(t * 0.6)); e.y = e.baseY + Math.sin(a * 1.7) * 18;
        e.angle = Math.atan2(Math.cos(a * 1.7) * 18 * 1.7, -Math.sin(a) * R); e.vx = Math.cos(e.angle) * 120; e.vy = Math.sin(e.angle) * 120;
        e.state = (Math.floor(t / 4) % 3 === 2) ? 'windup' : 'wander'; e.stateT = (t % 4) * 0.2;
        if (e.state === 'windup') { e.vx = e.vy = 0; }
      } else {
        const sp = 180 + i * 15;
        e.x = ((t * sp + i * 250) % 700) + 20; e.y = e.baseY + Math.sin(t * 1.3 + i) * 10;
        e.angle = 0; e.vx = sp; e.vy = 0;
      }
    });
  }

  const dt = 1 / 60;
  let t = FREEZE !== null ? FREEZE : 0, last = performance.now();
  function frame(now) {
    const real = Math.min(0.05, (now - last) / 1000); last = now;
    if (FREEZE === null) t += real;
    ctx.drawImage(bg, 0, 0);
    label('APEX vertebrates  -  large (r=' + bigR + ')', 90, 18, 12);
    updateFly(t);
    for (const e of ALL) {
      applyState(e, t);
      stepAnim(e, FREEZE !== null ? dt : real, t);
    }
    // large + their labels
    big.forEach((e) => { drawCreature(e, t); label(e.sp, e.home.x, e.home.y + (mode === 'big' ? 100 : 72), 13); });
    if (mode === 'states') {
      states.forEach((e) => { drawCreature(e, t); if (e.x < 200) label(e.sp, 60, e.y + 70, 12); });
      ['idle', 'windup', 'lunge', 'bite', 'hurt', 'desperate', 'hop/rest'].forEach((n, i) => label(n, 130 + i * 200, 24, 12));
    } else if (mode !== 'big') {
      label('gameplay sizes r = 12 / 17 / 22 / 28', 360, 245, 12);
      small.forEach((e) => drawCreature(e, t));
      label('states: idle  windup  lunge  bite  hurt  desperate  hop/rest', 1100, 262, 12);
      states.forEach((e) => { drawCreature(e, t); });
      SLNAMES.forEach((sp, ri) => label(sp, 770, 310 + ri * 96, 11));
      label('flight (alt 1 / .6) and slithering snakes (trail)', 360, 462, 12);
      fly.forEach((e) => drawCreature(e, t));
    }
    if (FREEZE === null) requestAnimationFrame(frame);
  }
  // when frozen, advance phase by simulating some frames first
  if (FREEZE !== null) {
    for (let i = 0; i < Math.round(FREEZE * 60); i++) {
      const tt = i / 60; updateFly(tt);
      for (const e of ALL) { applyState(e, tt); stepAnim(e, dt, tt); drawCreature && 0; }
      if (i % 2 === 0) for (const e of fly) if (e.sp === 'snake') { ctx.save(); ctx.globalAlpha = 0; drawCreature(e, tt); ctx.restore(); }
    }
  }
  requestAnimationFrame(frame);
})();
</script></body></html>
